services:
  heof-db:
    restart: always
    ports: []                          

  heof-redis:
    restart: always
    ports: []                          

  heof-app:
    build:
      context: .
      dockerfile: Dockerfile           # prod multi-stage образ
    container_name: heof-app-prod
    restart: always
    env_file:
      - .env.prod
    # volumes mount убран — код внутри образа
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
