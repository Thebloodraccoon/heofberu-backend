services:
  heof-db:
    restart: always
    ports: !reset []

  heof-redis:
    restart: always
    ports: !reset []

  heof-auth-redis:
    restart: always
    ports: !reset []

  heof-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heof-app-prod
    restart: always
    env_file:
      - .env.prod
    environment:
      STAGE: prod
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
