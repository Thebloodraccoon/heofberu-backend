services:
  heof-db:
    restart: always
    ports: []                          

  heof-redis:
    restart: always
    ports: []                          

  heof-app:
    build:
      context: .
      dockerfile: Dockerfile           # prod multi-stage образ
    container_name: heof-app-prod
    restart: always
    env_file:
      - .env.prod
    # volumes mount убран — код внутри образа
    deploy:
      resources:
        limits:
          # 4 uvicorn workers + asyncpg/redis pools: 1 CPU / 512M starved the
          # workers under concurrent load (bcrypt alone costs ~100-300ms CPU).
          cpus: "2.0"
          memory: 1G
