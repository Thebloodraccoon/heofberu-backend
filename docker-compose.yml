services:
  heof-db:
    image: postgres:15.4-alpine
    container_name: heof-db
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${DB_MAX_CONNECTIONS:-100}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - heof_db_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  heof-redis:
    image: redis:7.2.3-alpine
    container_name: heof-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --maxmemory 256mb --maxmemory-policy volatile-lru $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - heof_redis_data:/data
    networks:
      - app_network
    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  heof-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heof-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      heof-db:
        condition: service_healthy
      heof-redis:
        condition: service_healthy
    networks:
      - app_network

volumes:
  heof_db_data:
  heof_redis_data:

networks:
  app_network:
    driver: bridge
